name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'COPYING.txt'
      - 'HISTORY.md'
      - 'LICENSE*'
      - 'README.md'
      - 'renovate.json5'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculate build number
        run: echo "BUILD_NUMBER=$((RUN_ID + 1050))" >> "$GITHUB_ENV"
        env:
          RUN_ID: ${{ github.run_number }}

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew clean test spotlessCheck package --no-daemon

      - name: Verify packaged TLS on legacy Java 8 and Java 25
        run: |
          set -euo pipefail
          # Keep this old runtime: current Java 8 has APIs absent from users' older installations.
          legacy_java="$RUNNER_TEMP/launcher-java8u202"
          archive="$RUNNER_TEMP/launcher-java8u202.tar.gz"
          curl --fail --location --output "$archive" \
            https://github.com/AdoptOpenJDK/openjdk8-binaries/releases/download/jdk8u202-b08/OpenJDK8U-jre_x64_linux_hotspot_8u202b08.tar.gz
          echo "b3f9934c6fc83fb2e76a4ded31367e5312013e27d36eac82a6fe1423aae394ce  $archive" | sha256sum --check -
          mkdir -p "$legacy_java"
          tar -xzf "$archive" -C "$legacy_java" --strip-components=1
          jar="build/libs/launcher-4.0-${BUILD_NUMBER}.jar"
          "$JAVA_HOME/bin/javac" --release 8 -cp "$jar" -d build/tls-smoke \
            src/test/java/net/technicpack/utilslib/TlsTestFixture.java \
            src/test/java/net/technicpack/utilslib/TlsSmoke.java
          for java in "$legacy_java/bin/java" "$JAVA_HOME/bin/java"; do
            "$java" -cp "build/tls-smoke:src/test/resources:$jar" net.technicpack.utilslib.TlsSmoke
          done

      - name: Add promotion shortcuts
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          promote_url="https://github.com/${REPOSITORY}/actions/workflows/promote.yml"

          {
            echo "## Promotion Shortcuts"
            echo ""
            echo "CLI command for this exact build:"
            echo ""
            echo "\`gh workflow run promote.yml -f run_id=${RUN_ID}\`"
            echo ""
            echo "Web UI:"
            echo "${promote_url}"
            echo ""
            echo "Use \`run_id=${RUN_ID}\` in the **Run workflow** form."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Archive artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-${{ env.BUILD_NUMBER }}
          path: |
            build/libs/launcher-*.jar
            build/libs/launcher-*.exe
            build/distributions/launcher-*-osx.app.zip
          if-no-files-found: error
          compression-level: 0

      - name: Update dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: true
